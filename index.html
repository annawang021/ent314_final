<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>What Happens Next</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;1,300;1,400&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      color: #fff;
      font-family: 'IBM Plex Mono', 'Courier New', monospace;
      font-weight: 300;
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── SCREEN ─────────────────────────────────────────────────────────── */
    #screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .page {
      max-width: 680px;
      width: 90%;
      padding: 88px 0;
    }

    /* ── TYPOGRAPHY ─────────────────────────────────────────────────────── */

    /* Cold blue-white header */
    .page-label {
      font-size: 0.7rem;
      font-weight: 400;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: #9ec5fe;
      text-shadow:
        0 0 8px rgba(158, 197, 254, 1),
        0 0 22px rgba(100, 160, 255, 0.7),
        0 0 55px rgba(80, 130, 255, 0.3);
      margin-bottom: 56px;
      opacity: 0;
    }

    /* Blue bold variant for opening line */
    .body-para--blue {
      font-weight: 700;
      color: #9ec5fe;
      text-shadow:
        0 0 8px rgba(158, 197, 254, 1),
        0 0 24px rgba(100, 160, 255, 0.7),
        0 0 55px rgba(80, 130, 255, 0.35);
    }

    /* Body paragraph */
    .body-para {
      font-size: 1.1rem;
      font-weight: 300;
      line-height: 2.05;
      color: #f0f0f0;
      text-shadow:
        0 0 4px rgba(255, 255, 255, 0.7),
        0 0 14px rgba(255, 255, 255, 0.2);
      margin-bottom: 36px;
      opacity: 0;
    }

    /* Italic quote — indented, blue glow */
    .quote {
      margin: 4px 0 36px 28px;
      padding-left: 18px;
      border-left: 1px solid rgba(158, 197, 254, 0.2);
      font-style: italic;
      font-weight: 300;
      font-size: 0.98rem;
      line-height: 1.95;
      color: #9ec5fe;
      text-shadow:
        0 0 6px rgba(158, 197, 254, 0.7),
        0 0 18px rgba(100, 160, 255, 0.3);
      opacity: 0;
    }

    /* ── BUTTONS ────────────────────────────────────────────────────────── */

    .btn-next {
      background: none;
      border: 1px solid rgba(158, 197, 254, 0.35);
      font-family: inherit;
      font-weight: 400;
      font-size: 0.88rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #9ec5fe;
      text-shadow:
        0 0 8px rgba(158, 197, 254, 0.9),
        0 0 26px rgba(100, 160, 255, 0.42);
      box-shadow:
        0 0 12px rgba(100, 150, 255, 0.1),
        inset 0 0 12px rgba(100, 150, 255, 0.04);
      cursor: pointer;
      padding: 13px 34px;
      margin-top: 52px;
      display: inline-block;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .btn-next.ready {
      pointer-events: auto;
    }

    .btn-next:hover {
      border-color: rgba(158, 197, 254, 0.7);
      text-shadow:
        0 0 12px rgba(158, 197, 254, 1),
        0 0 36px rgba(100, 160, 255, 0.72);
      box-shadow:
        0 0 26px rgba(100, 150, 255, 0.28),
        inset 0 0 18px rgba(100, 150, 255, 0.08);
    }

    .btn-begin {
      background: none;
      border: 1px solid rgba(158, 197, 254, 0.3);
      font-family: inherit;
      font-weight: 400;
      font-size: 0.78rem;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: #9ec5fe;
      text-shadow:
        0 0 8px rgba(158, 197, 254, 0.9),
        0 0 26px rgba(100, 160, 255, 0.42);
      box-shadow:
        0 0 12px rgba(100, 150, 255, 0.1),
        inset 0 0 12px rgba(100, 150, 255, 0.04);
      cursor: pointer;
      padding: 14px 38px;
      margin-top: 60px;
      display: inline-block;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
    }

    .btn-begin.ready {
      pointer-events: auto;
    }

    .btn-begin:hover {
      border-color: rgba(158, 197, 254, 0.7);
      text-shadow:
        0 0 12px rgba(158, 197, 254, 1),
        0 0 36px rgba(100, 160, 255, 0.72);
      box-shadow:
        0 0 26px rgba(100, 150, 255, 0.28),
        inset 0 0 18px rgba(100, 150, 255, 0.08);
    }

    /* ── ANIMATIONS ─────────────────────────────────────────────────────── */

    @keyframes revealFade {
      from {
        opacity: 0;
        transform: translateY(7px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* Dramatic body flicker — drops to near-black briefly, recovers */
    @keyframes bodyFlicker {

      0%,
      100% {
        opacity: 1;
      }

      4% {
        opacity: 0.82;
      }

      5% {
        opacity: 0.08;
      }

      6% {
        opacity: 1;
      }

      9% {
        opacity: 0.75;
      }

      10% {
        opacity: 0.05;
      }

      11% {
        opacity: 1;
      }

      50% {
        opacity: 1;
      }

      52% {
        opacity: 0.55;
      }

      53% {
        opacity: 1;
      }

      80% {
        opacity: 1;
      }

      81% {
        opacity: 0.12;
      }

      82% {
        opacity: 0.9;
      }

      83% {
        opacity: 1;
      }
    }

    /* Header flicker — same timing but also collapses the glow */
    @keyframes headerFlicker {

      0%,
      100% {
        opacity: 1;
        text-shadow:
          0 0 8px rgba(158, 197, 254, 1),
          0 0 22px rgba(100, 160, 255, 0.7),
          0 0 55px rgba(80, 130, 255, 0.3);
      }

      3% {
        opacity: 0.75;
        text-shadow: 0 0 3px rgba(158, 197, 254, 0.3);
      }

      4% {
        opacity: 0.05;
        text-shadow: none;
      }

      5% {
        opacity: 1;
        text-shadow:
          0 0 16px rgba(158, 197, 254, 1),
          0 0 42px rgba(100, 160, 255, 1),
          0 0 80px rgba(80, 130, 255, 0.55);
      }

      10% {
        opacity: 0.08;
        text-shadow: none;
      }

      11% {
        opacity: 1;
        text-shadow:
          0 0 8px rgba(158, 197, 254, 1),
          0 0 22px rgba(100, 160, 255, 0.7),
          0 0 55px rgba(80, 130, 255, 0.3);
      }

      52% {
        opacity: 1;
      }

      53% {
        opacity: 0.4;
        text-shadow: none;
      }

      54% {
        opacity: 1;
        text-shadow:
          0 0 8px rgba(158, 197, 254, 1),
          0 0 22px rgba(100, 160, 255, 0.7);
      }

      79% {
        opacity: 1;
      }

      80% {
        opacity: 0.1;
        text-shadow: none;
      }

      81% {
        opacity: 0.88;
      }

      82% {
        opacity: 1;
      }
    }

    /* Applied classes */
    .show {
      animation: revealFade 1.1s ease forwards;
    }

    .show.flicker-body {
      animation: revealFade 1.1s ease forwards, bodyFlicker 7s ease-in-out 1.4s 1 forwards;
    }

    .show.flicker-header {
      animation: revealFade 0.7s ease forwards, headerFlicker 5s ease-in-out 1s infinite;
    }

    /* ── YEAR HEADER ────────────────────────────────────────────────────── */
    .year-header {
      font-size: 2.2rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      color: #9ec5fe;
      text-shadow:
        0 0 10px rgba(158, 197, 254, 1),
        0 0 28px rgba(100, 160, 255, 0.7),
        0 0 60px rgba(80, 130, 255, 0.3);
      margin-bottom: 60px;
      opacity: 0;
    }

    /* ── FOOTNOTE ───────────────────────────────────────────────────────── */
    .footnote {
      font-size: 0.75rem;
      font-style: italic;
      font-weight: 300;
      color: #fff;
      text-shadow: 0 0 2px rgba(255, 255, 255, 0.2);
      margin-top: 8px;
      margin-bottom: 44px;
      line-height: 1.75;
      opacity: 0;
    }

    .footnote a {
      color: #9ec5fe;
      text-decoration: none;
      text-shadow: 0 0 5px rgba(158, 197, 254, 0.5);
      margin-left: 6px;
    }

    .footnote a:hover {
      text-shadow:
        0 0 9px rgba(158, 197, 254, 0.9),
        0 0 20px rgba(100, 160, 255, 0.4);
    }

    /* ── CHOICE BUTTONS ─────────────────────────────────────────────────── */
    .choice-btn {
      display: block;
      width: 100%;
      background: none;
      border: 1px solid rgba(158, 197, 254, 0.3);
      font-family: inherit;
      font-weight: 300;
      font-size: 1rem;
      line-height: 1.65;
      color: #9ec5fe;
      text-align: left;
      padding: 16px 22px;
      margin-bottom: 12px;
      cursor: pointer;
      text-shadow: 0 0 6px rgba(158, 197, 254, 0.55);
      box-shadow:
        0 0 8px rgba(100, 150, 255, 0.05),
        inset 0 0 8px rgba(100, 150, 255, 0.02);
      transition:
        transform 0.18s ease,
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease,
        text-shadow 0.2s ease;
      opacity: 0;
      pointer-events: none;
    }

    .choice-btn.ready {
      pointer-events: auto;
    }

    .choice-btn:hover {
      transform: scale(0.97);
      border-color: rgba(158, 197, 254, 0.65);
      box-shadow:
        0 0 18px rgba(100, 150, 255, 0.18),
        inset 0 0 12px rgba(100, 150, 255, 0.06);
    }

    .choice-btn.selected {
      border-color: rgba(158, 197, 254, 0.88);
      background: rgba(100, 150, 255, 0.07);
      text-shadow:
        0 0 9px rgba(158, 197, 254, 0.9),
        0 0 24px rgba(100, 160, 255, 0.45);
      box-shadow:
        0 0 22px rgba(100, 150, 255, 0.24),
        inset 0 0 14px rgba(100, 150, 255, 0.07);
    }

    .choice-btn.selecting {
      animation: choiceClick 0.4s ease forwards;
    }

    @keyframes choiceClick {
      0% {
        transform: scale(1);
      }

      30% {
        transform: scale(0.92);
      }

      65% {
        transform: scale(1.04);
      }

      100% {
        transform: scale(1);
      }
    }

    /* ── NUDGE ──────────────────────────────────────────────────────────── */
    #nudge {
      position: fixed;
      bottom: 52px;
      left: 50%;
      transform: translateX(-50%);
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #9ec5fe;
      box-shadow:
        0 0 12px rgba(158, 197, 254, 1),
        0 0 28px rgba(158, 197, 254, 0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.7s ease;
      z-index: 50;
    }

    #nudge.visible {
      opacity: 1;
    }

    #nudge::before,
    #nudge::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 1px solid rgba(158, 197, 254, 0.65);
      transform: translate(-50%, -50%) scale(1);
      opacity: 0;
      animation: nudgePulse 2.4s ease-out infinite;
    }

    #nudge::after {
      animation-delay: 1.2s;
    }

    @keyframes nudgePulse {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.75;
      }

      100% {
        transform: translate(-50%, -50%) scale(5.5);
        opacity: 0;
      }
    }

    /* ── RESULTS PAGE ────────────────────────────────────────────────────── */
    .page--results {
      padding-top: 80px;
      padding-bottom: 120px;
    }

    .results-label {
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: #9ec5fe;
      text-shadow:
        0 0 7px rgba(158, 197, 254, 0.8),
        0 0 20px rgba(100, 160, 255, 0.4);
      margin-bottom: 20px;
    }

    .section-label {
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      color: #9ec5fe;
      text-shadow:
        0 0 6px rgba(158, 197, 254, 0.7),
        0 0 16px rgba(100, 160, 255, 0.35);
      margin-top: 48px;
      margin-bottom: 20px;
    }

    .results-actions {
      margin-top: 64px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: flex-start;
    }

    .btn-action {
      background: none;
      border: 1px solid rgba(158, 197, 254, 0.35);
      font-family: inherit;
      font-weight: 400;
      font-size: 0.88rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #9ec5fe;
      text-shadow:
        0 0 8px rgba(158, 197, 254, 0.9),
        0 0 26px rgba(100, 160, 255, 0.42);
      box-shadow:
        0 0 12px rgba(100, 150, 255, 0.1),
        inset 0 0 12px rgba(100, 150, 255, 0.04);
      cursor: pointer;
      padding: 13px 34px;
      display: inline-block;
      transition: all 0.3s ease;
    }

    .btn-action:hover {
      border-color: rgba(158, 197, 254, 0.7);
      text-shadow:
        0 0 12px rgba(158, 197, 254, 1),
        0 0 36px rgba(100, 160, 255, 0.72);
      box-shadow:
        0 0 26px rgba(100, 150, 255, 0.28),
        inset 0 0 18px rgba(100, 150, 255, 0.08);
    }

    /* ── REFLECTION PAGE ────────────────────────────────────────────────── */
    .reflection-question {
      font-size: 0.95rem;
      line-height: 1.9;
      color: #9ec5fe;
      text-shadow:
        0 0 7px rgba(158, 197, 254, 0.7),
        0 0 18px rgba(100, 160, 255, 0.3);
      padding-left: 20px;
      border-left: 1px solid rgba(158, 197, 254, 0.25);
      margin-bottom: 14px;
    }

    .reflection-source {
      font-size: 0.82rem;
      line-height: 1.75;
      color: rgba(255, 255, 255, 0.4);
      text-shadow: none;
      margin-bottom: 8px;
    }

    .reflection-source a {
      color: rgba(158, 197, 254, 0.6);
      text-decoration: none;
      transition: color 0.2s ease, text-shadow 0.2s ease;
    }

    .reflection-source a:hover {
      color: #9ec5fe;
      text-shadow: 0 0 8px rgba(158, 197, 254, 0.7);
    }

    /* ── TOGGLE DROPDOWNS ───────────────────────────────────────────────── */
    .toggle-wrap {
      margin-top: 48px;
    }

    .toggle-btn {
      background: none;
      border: none;
      border-bottom: 1px solid rgba(158, 197, 254, 0.2);
      font-family: inherit;
      font-weight: 400;
      font-size: 0.68rem;
      letter-spacing: 0.38em;
      text-transform: uppercase;
      color: #9ec5fe;
      text-shadow:
        0 0 6px rgba(158, 197, 254, 0.6),
        0 0 16px rgba(100, 160, 255, 0.3);
      cursor: pointer;
      padding: 0 0 14px 0;
      width: 100%;
      text-align: left;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: text-shadow 0.2s ease, border-color 0.2s ease;
    }

    .toggle-btn:hover {
      text-shadow:
        0 0 10px rgba(158, 197, 254, 1),
        0 0 26px rgba(100, 160, 255, 0.6);
      border-color: rgba(158, 197, 254, 0.5);
    }

    .toggle-arrow {
      font-size: 0.7rem;
      transition: transform 0.3s ease;
      display: inline-block;
    }

    .toggle-btn.open .toggle-arrow {
      transform: rotate(90deg);
    }

    .toggle-body {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.4s ease, opacity 0.3s ease;
      opacity: 0;
      padding-left: 4px;
    }

    .toggle-body.open {
      max-height: 2000px;
      opacity: 1;
    }

    .toggle-body .reflection-source {
      margin-top: 16px;
      margin-bottom: 0;
    }

    .toggle-body .reflection-source:last-child {
      margin-bottom: 16px;
    }

    .toggle-body .toggle-sub-label {
      font-size: 0.62rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(158, 197, 254, 0.45);
      margin-top: 20px;
      margin-bottom: 4px;
    }

    .ai-prompt-item {
      font-size: 0.82rem;
      line-height: 1.75;
      color: rgba(255, 255, 255, 0.4);
      padding: 12px 0 12px 16px;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      margin-top: 14px;
    }

    /* ── PAGE TRANSITION OVERLAY ────────────────────────────────────────── */
    #overlay {
      position: fixed;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      z-index: 999;
      transition: opacity 0.55s ease;
    }

    #overlay.visible {
      opacity: 1;
      pointer-events: all;
    }
  </style>
</head>

<body>

  <audio id="bg-audio" loop>
    <source src="Existential Deep Space Ambient.mp3" type="audio/mpeg">
  </audio>
  <audio id="guild-audio" loop>
    <source src="Silver Future World Relaxing Sci-Fi Ambient 5 min (4K).mp3" type="audio/mpeg">
  </audio>
  <audio id="zoo-audio" loop>
    <source src="Spirograph Machine_ 5 minutes Melodic Ambient Music.mp3" type="audio/mpeg">
  </audio>
  <audio id="reflection-audio" loop>
    <source src="mus314_final_back.wav" type="audio/wav">
  </audio>
  <div id="overlay"></div>
  <div id="nudge"></div>
  <div id="screen"></div>

  <script>
    // ── OPENING PAGES ───────────────────────────────────────────────────────────
    const openingPages = [
      {
        build(container) {
          container.innerHTML = `
          <div class="page">
            <p class="body-para body-para--blue" data-reveal="0" data-effect="flicker-body">
              We might be the last generation that will remember being the most
              capable thing on the planet.
            </p>
            <p class="body-para" data-reveal="1">
              In 2023, hundreds of AI leaders, including the CEOs of OpenAI,
              DeepMind, and Anthropic, signed a one-sentence statement:
            </p>
            <blockquote class="quote" data-reveal="1">
              Mitigating the risk of extinction from AI should be a global
              priority alongside other societal-scale risks such as pandemics
              and nuclear war.
            </blockquote>
            <p class="body-para" data-reveal="1">
              Between 2023 and 2026, AI surpassed human performance on many
              cognitive benchmarks we used to care about. Unemployment rates
              began to rise, particularly in entry-level white-collar roles.
              The era of AI replacing human workers officially began.
            </p>
            <button class="btn-next" data-reveal="2" onclick="goNext()">next</button>
          </div>`;
        }
      },
      {
        build(container) {
          container.innerHTML = `
          <div class="page">
            <p class="body-para" data-reveal="0">
              What happens to meaning and value when we're no longer the most
              capable thing on the planet? What is left for humans to be?
            </p>
            <button class="btn-next" data-reveal="1" onclick="goNext()">next</button>
          </div>`;
        }
      },
      {
        build(container) {
          container.innerHTML = `
          <div class="page">
            <p class="body-para" data-reveal="0">
              You have been chosen to decide what happens next. Your choices
              will route you into one of two possible futures.
            </p>
            <p class="body-para" data-reveal="1">
              When you're ready, click "Begin."
            </p>
            <button class="btn-begin" data-reveal="1" onclick="beginGame()">Begin</button>
          </div>`;
        }
      }
    ];

    // ── DECISIONS DATA ──────────────────────────────────────────────────────────
    const decisions = [
      {
        year: '2027',
        paragraphs: [
          'You are 23. Your first job out of college was at a finance firm.',
          'Six months in, the firm announces it will replace the entire junior team with AI.',
          'They offer you a choice: take a generous severance and figure out what\'s next, or stay on as an "AI oversight" specialist.'
        ],
        footnote: 'In 2025, 30% of companies have already replaced workers with AI.',
        footnoteUrl: 'https://www.hrdive.com/news/companies-will-replace-workers-with-ai-by-2026/760729/',
        choices: ['Take the severance.', 'Stay in oversight.', 'Quit and start your own business.'],
        scores: ['G', 'Z', 'G']
      },
      {
        year: '2029',
        paragraphs: [
          'A new personal AI agent launches. It\'s free to use.',
          'It promises to handle your scheduling, finances, emails, research, and shopping. In exchange, it sends your data to the company to further train the model.',
          'Three of your closest friends have signed up already.'
        ],
        footnote: 'Google and Meta are building personal AI agents, built into Android and Instagram respectively.',
        footnoteUrl: 'https://www.pymnts.com/news/artificial-intelligence/2026/big-tech-personal-ai-agents-are-coming-to-do-list/',
        choices: ['Sign up and get full access.', 'Find an alternative stripped-down, open-source version.', 'Don\'t sign up.'],
        scores: ['Z', 'G', 'G']
      },
      {
        year: '2032',
        paragraphs: [
          'Unemployment has hit 22%.',
          'A national referendum proposes a Universal Basic Income, funded by heavy taxes on the AI companies.',
          'Companies are lobbying against it, warning of slowing innovation. Your community is divided.'
        ],
        footnote: 'Sam Altman has proposed an "American Equity Fund" where AI companies contribute 2.5% of their value annually to citizens.',
        footnoteUrl: 'https://moores.samaltman.com/',
        choices: ['Vote yes.', 'Vote no.', 'Don\'t vote.'],
        scores: ['G', 'Z', 'Z']
      },
      {
        year: '2036',
        paragraphs: [
          'An AI tutor released this year is now demonstrably better than the best human teacher in your city. It is patient, personalized, and more effective by every measurable standard.',
          'Your daughter is eight.',
          'Her school is establishing it as the new default.'
        ],
        footnote: 'Alpha School has replaced human teachers with AI tutors.',
        footnoteUrl: 'https://theweek.com/education/alpha-school-replaces-teachers-ai',
        choices: ['Keep her enrolled, AI tutoring only.', 'Move her to a different school, with human teachers.', 'Do both: AI for academics, humans for everything else.'],
        scores: ['Z', 'G', 'G']
      },
      {
        year: '2040',
        paragraphs: [

    function switchTrack(newId) {
      const next = document.getElementById(newId);
      if (!next) return;
      if (currentAudio && currentAudio !== next) {
        const fading = currentAudio;
        const startVol = fading.volume;
        const steps = 20;
        let step = 0;
        const fadeOut = setInterval(() => {
          step++;
          fading.volume = Math.max(0, startVol * (1 - step / steps));
          if (step >= steps) {
            clearInterval(fadeOut);
            fading.pause();
            fading.currentTime = 0;
          }
        }, 50);
      }
      next.volume = 0;
      next.play().catch(() => { });
      currentAudio = next;
      const steps = 20;
      let step = 0;
      const fadeIn = setInterval(() => {
        step++;
        next.volume = Math.min(0.67, 0.67 * (step / steps));
        if (step >= steps) clearInterval(fadeIn);
      }, 50);
    }

        if (s > maxRevealStep) maxRevealStep = s;

          <p class="body-para show">Writing the two scenarios genuinely unsettled me. Even the "happy" one. I typically have an optimistic view on AI, so when I was considering a post-work society, I first thought of a situation where people are freed from the jobs they currently feel trapped in and could get paid for doing something they loved instead. The world would be so much better if people had more time to be creative, to do the things they actually enjoy… right? As I continued building the scenario though, I realized that this would have to come at a cost. Realistically, it could not be a utopia.</p>

      switchTrack('bg-audio');
      const screen = document.getElementById('screen');
      screen.style.alignItems = '';
      fadeTransition(() => renderPage(0));
    }

    // ── CLICK TO REVEAL ─────────────────────────────────────────────────────────
    document.addEventListener('click', function (e) {
      startAudio();
      if (e.target.closest('.btn-next.ready, .btn-begin.ready, .choice-btn.ready')) return;

      hideNudge();
      if (revealStep >= maxRevealStep) return;

      revealStep++;
      revealElements(revealStep);
      if (revealStep < maxRevealStep) scheduleNudge(10000);
    });

    // ── NAVIGATION ──────────────────────────────────────────────────────────────
    function goNext() {
      if (pageIndex >= openingPages.length - 1) return;
      fadeTransition(() => { pageIndex++; renderPage(pageIndex); });
    }

    function beginGame() {
      tally.G = 0; tally.Z = 0; currentDecision = 0;
      fadeTransition(() => renderDecision(0));
    }

    function fadeTransition(callback) {
      const overlay = document.getElementById('overlay');
      overlay.classList.add('visible');
      setTimeout(() => {
        callback();
        setTimeout(() => overlay.classList.remove('visible'), 150);
      }, 620);
    }

    // ── INIT ────────────────────────────────────────────────────────────────────
    renderPage(0);
  </script>
</body>

</html>
